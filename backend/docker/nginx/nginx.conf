server {
    listen 80;
    server_name localhost;
    root /COURCE/public;

    index index.php index.html;

    charset utf-8;

    # Increase max upload size (must be before location blocks)
    client_max_body_size 256M;
    client_body_buffer_size 128k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout và buffer cho upload file lớn
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_connect_timeout 600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }


    # ============================
    # 1) Playlist .m3u8 (BẮT BUỘC CÓ SIGNATURE)
    # ============================
    # Khớp mọi URL kết thúc bằng .m3u8 trong thư mục /storage/lesson/videos/...
    location ~ ^/storage/lesson/videos/.+\.m3u8$ {
        # Thư mục gốc Laravel public
        # => file thật sẽ là: /Users/.../backend/public/storage/lesson/videos/...
        root /COURCE/public;

        # secure_link: md5(expires + uri + secret)
        secure_link $arg_signature,$arg_expires;
        set $secure_link_secret "kuado18yd1SAhd19asSAS";
        secure_link_md5 "$secure_link_expires$uri$secure_link_secret";

        # BẮT BUỘC phải có md5 trong query, nếu không → 403
        if ($arg_signature = "") {
            return 403;
        }

        # Nếu md5 không khớp / hết hạn → 410 (Gone) hoặc 403
        if ($secure_link = "") {
            return 403;
        }
        if ($secure_link = "0") {
            return 410;
        }

        # CORS (nếu cần)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';

        # Cache
        add_header Cache-Control "public, max-age=31536000";

        types {
            application/vnd.apple.mpegurl m3u8;
        }
    }

    # ============================
    # 2) Segment .ts (KHÔNG CHECK SIGNATURE)
    # ============================
    # Khớp mọi URL .ts dưới /storage/lesson/videos/...
    location ~ ^/storage/lesson/videos/.+\.ts$ {
        root /COURCE/public;

        # CORS
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';

        # Cache dài cho segment
        add_header Cache-Control "public, max-age=31536000";

        types {
            video/mp2t ts;
        }
    }


    location ~ /\.(?!well-known).* {
        deny all;
    }
}
