version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_app
    restart: unless-stopped
    working_dir: /home/ducmanh/rdi
    volumes:
      - .:/home/ducmanh/rdi
    networks:
      - lms_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/home/ducmanh/rdi
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lms_network
    depends_on:
      - app

networks:
  lms_network:
    driver: bridge
